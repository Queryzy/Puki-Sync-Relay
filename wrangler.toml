name = "puki-sync-relay"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "puki-sync-db"
database_id = "puki-sync-db-id"

# Scheduled Cron Trigger (Daily Prune at 03:00 UTC)
[triggers]
crons = ["0 3 * * *"]
